logistics_duckdb:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/data/logistics.duckdb') }}"
      extensions:
        - httpfs
        - aws

      settings:
        # ── Cấu hình S3 / Floci ────────────────────────────────────────────
        s3_endpoint: "{{ env_var('S3_ENDPOINT_URL') | replace('http://', '') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
        s3_region: "{{ env_var('AWS_DEFAULT_REGION', 'us-east-1') }}"
        s3_use_ssl: false
        s3_url_style: path
